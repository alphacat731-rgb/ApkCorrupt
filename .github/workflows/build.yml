name: Build APK Corrupt

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore ApkCorrupt.sln

      - name: Build
        run: dotnet build ApkCorrupt.sln -c Debug -f net10.0-android --no-restore -p:EmbedAssembliesIntoApk=true

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          apk="$(find src/ApkCorrupt/bin/Debug/net10.0-android -name '*.apk' -type f | head -n 1)"
          test -n "$apk"

          echo "APK: $apk"
          echo "Checking that managed assemblies are embedded..."

          if ! unzip -l "$apk" | grep -qE '(^|/)assemblies/'; then
            echo "ERROR: APK does not contain embedded managed assemblies."
            echo "This would produce the 'No assemblies found' Fast Deployment crash on a standalone install."
            exit 1
          fi

          cp "$apk" artifacts/ApkCorrupt.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apkcorrupt
          path: artifacts/ApkCorrupt.apk
