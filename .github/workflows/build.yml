# Build verification marker: 2026-09-23
name: Build APK Corrupt

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore ApkCorrupt.sln

      - name: Build standalone APK
        run: dotnet build ApkCorrupt.sln -c Release -f net10.0-android --no-restore

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          apk="$(find src/ApkCorrupt/bin/Release/net10.0-android -name '*.apk' -type f | head -n 1)"
          test -n "$apk"

          echo "APK: $apk"
          echo "Checking that managed assemblies are embedded..."

          # .NET 9/10 Android normally stores managed assemblies in the ABI-specific
          # assembly store under lib/, rather than the older assemblies/ directory.
          # Accept both layouts so the check matches the actual APK format.
          unzip -Z1 "$apk" > apk-entries.txt

          # Read the ZIP listing from a file instead of piping unzip into grep -q.
          # With pipefail enabled, grep -q can close the pipe early and make unzip
          # exit with SIGPIPE, which incorrectly turns a successful match into a CI failure.
          if ! grep -qE '(^|/)(assemblies/|lib/[^/]+/(libassembly-store\.so|libassemblies\.[^/]+\.blob\.so))' apk-entries.txt; then
            echo "ERROR: Release APK does not contain an embedded managed assembly store."
            echo "The APK must be self-contained so it can be installed and launched without Fast Deployment."
            echo "APK entries under lib/:"
            grep -E '(^|/)lib/' apk-entries.txt | head -n 40 || true
            exit 1
          fi

          echo "Embedded managed assembly store detected."

          cp "$apk" artifacts/ApkCorrupt.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apkcorrupt
          path: artifacts/ApkCorrupt.apk
